name: Build Android APK

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK_MGR="$(command -v sdkmanager || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager | head -n 1)"
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: verto-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build Signed Release APK (if signing secrets configured)
        id: release_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            python3 - <<'PY'
          import base64, os, re, sys

          raw = os.environ.get("KEYSTORE_BASE64", "")
          cleaned = re.sub(r"\s+", "", raw).strip("\"'")
          missing_pad = len(cleaned) % 4
          if missing_pad:
              cleaned += "=" * (4 - missing_pad)

          try:
              data = base64.b64decode(cleaned, validate=True)
          except Exception:
              print(f"::error::KEYSTORE_BASE64 is not valid base64 (length={len(cleaned)}). Re-copy the full contents of keystore_base64.txt.", file=sys.stderr)
              sys.exit(1)

          if len(data) < 100:
              print(f"::error::Decoded keystore is unexpectedly small ({len(data)} bytes). Verify KEYSTORE_BASE64 holds the full encoded .jks file.", file=sys.stderr)
              sys.exit(1)

          with open(os.environ["KEYSTORE_PATH"], "wb") as f:
              f.write(data)
          print(f"Decoded keystore ({len(data)} bytes).")
          PY
            gradle :app:assembleRelease --no-daemon --max-workers=2 || (sleep 10 && gradle :app:assembleRelease --no-daemon --max-workers=2)
            echo "built_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Signing secrets not configured; skipping release APK."
            echo "built_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Release APK artifact
        if: steps.release_apk.outputs.built_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verto-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false
